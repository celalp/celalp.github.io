# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Alper Celik, Ph.D. | Senior Bioinformatician & Data Scientist"
email: "celalper@gmail.com"
description: >-
  Senior Bioinformatician & Data Scientist specializing in machine learning, high-performance computing, clinical NLP, and multi-omics data integration.

github_username: celalp
minimal_mistakes_skin: air
search: true

footer:
  links: []
  copyright:
    enabled: false

sass:
  style: compressed

# Build settings
markdown: kramdown
remote_theme: celalp/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jemoji
  - jekyll-include-cache

author:
  name   : "Alper Celik, Ph.D."
  avatar : "/assets/images/bio-photo.jpg"
  bio    : "Senior Bioinformatician & Data Scientist at SickKids. Expert in machine learning, multi-omics pipelines, clinical NLP, and data infrastructure."
  links:
    - label: "Website"
      icon: "fas fa-fw fa-globe"
      url: "https://celalp.github.io/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/celalp"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/alper-celik-51336460/"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: https://scholar.google.ca/citations?user=pM7OqIYAAAAJ&hl=en

permalink: /:categories/:title/

collections:
  talks:
    output: true
    permalink: /talks/:name/
  posts:
    output: true
    permalink: /posts/:name/

defaults:
  # _posts
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: single
      author_profile: true
  # _talks
  - scope:
      path: "_talks"
      type: talks
    values:
      layout: single
      author_profile: true
  - scope:
      path: "_about"
      type: about
    values:
      layout: single
      author_profile: true